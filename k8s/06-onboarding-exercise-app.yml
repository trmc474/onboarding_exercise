apiVersion: v1
kind: Service
metadata:
  name: onboarding-app-service
  namespace: onboarding-exercise
spec:
  type: NodePort
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080
  selector:
    app: onboarding-app
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: onboarding-app-deployment
  namespace: onboarding-exercise
spec:
  replicas: 1
  selector:
    matchLabels:
      app: onboarding-app
  template:
    metadata:
      labels:
        app: onboarding-app
    spec:
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command: [ 'sh', '-c', 'echo "Waiting for PostgreSQL..."; until nc -z postgres-service 5432; do sleep 2; done; echo "PostgreSQL ready!"' ]
        - name: wait-for-kafka
          image: busybox:1.36
          command: [ 'sh', '-c', 'echo "Waiting for Kafka..."; until nc -z kafka-service 9092; do sleep 2; done; echo "Kafka ready!"' ]
      containers:
        - name: onboarding-app
          image: onboarding-exercise:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgres-service:5432/onboarding_exercise_db
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: onboarding-secrets
                  key: POSTGRES_USER
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: onboarding-secrets
                  key: POSTGRES_PASSWORD
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              valueFrom:
                configMapKeyRef:
                  name: onboarding-config
                  key: SPRING_KAFKA_BOOTSTRAP_SERVERS
            - name: TZ
              value: Asia/Ho_Chi_Minh
