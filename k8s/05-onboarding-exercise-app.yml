apiVersion: apps/v1
kind: Deployment
metadata:
  name: onboarding-exercise-app-deployment
  namespace: onboarding-exercise
  labels:
    app: onboarding-exercise-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: onboarding-exercise-app
  template:
    metadata:
      labels:
        app: onboarding-exercise-app
    spec:
      containers:
        - name: onboarding-exercise-app
          image: onboarding-exercise:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://postgres-service:5432/onboarding_exercise_db"
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              value: "kafka-service:9092"
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: POSTGRES_PASSWORD
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 120
            periodSeconds: 30
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: onboarding-exercise-app-service
  namespace: onboarding-exercise
  labels:
    app: onboarding-exercise-app
spec:
  type: NodePort
  selector:
    app: onboarding-exercise-app
  ports:
    - port: 8080
      targetPort: 8080
      # nodePort will be assigned automatically (30000-32767 range)
